# Start the whole stack with:  docker compose up -d
# Image reference is the same one Jenkins builds and pushes:
#   nihit3003/calculator-devops:<IMAGE_TAG>
# Jenkins sets IMAGE_TAG to the build number so a deploy never uses a stale "latest".
# Run by hand with no variables set and it falls back to :latest.

services:
  calculator-app:
    image: ${IMAGE_NAME:-nihit3003/calculator-devops}:${IMAGE_TAG:-latest}
    container_name: calculator-app
    restart: unless-stopped
    environment:
      PORT: "8080"
    ports:
      # Direct access: http://localhost:8081  (8080 is left free for a local Jenkins)
      - "${APP_PORT:-8081}:8080"
    networks:
      - calculator-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  calculator-proxy:
    image: nginx:1.27-alpine
    container_name: calculator-proxy
    restart: unless-stopped
    ports:
      # Via proxy: http://localhost:8082
      - "${PROXY_PORT:-8082}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calculator-net
    depends_on:
      calculator-app:
        condition: service_healthy
    healthcheck:
      # Checks nginx only (not the app) -> no circular dependency
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  calculator-net:
    driver: bridge
