server {
    listen 80;
    server_name _;

    # Health of nginx itself. Deliberately does NOT call the app,
    # so there is no circular health dependency between the two services.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else is forwarded to the calculator service (Compose DNS name).
    location / {
        proxy_pass http://calculator-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
